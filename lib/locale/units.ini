# Angband unit display configuration
# One [locale] section per language code.
# Loaded at startup from lib/locale/units.ini based on the active language.
#
# Weight (burden/overweight)
#   Internal: tenths of pounds  (e.g. 7 = 0.7 lb)
#   Display:  val = internal * WeightMult / WeightDiv  (tenths of WeightUnit)
#             shown as  "%d.%d WeightUnit"
#
# Character weight (player->wt)
#   Internal: pounds (integer)
#   CharWeightFmt = STONES  →  "Nst Mlb"  using CharWeightStonesDiv (1 stone = 14 lb)
#   CharWeightFmt = DECIMAL →  "%d.%d CharWeightUnit"
#                   val = lbs * CharWeightMult / CharWeightDiv (tenths of unit)
#
# Height (player->ht)
#   Internal: inches (integer)
#   HeightFmt = FTIN    →  "N'M\""  using HeightFtDiv (1 foot = 12 inches)
#   HeightFmt = DECIMAL →  "%d HeightUnit"  (integer, not tenths)
#                   val = inches * HeightMult / HeightDiv
#
# Infravision (player->state.see_infra)
#   Internal: units of 10 feet  (e.g. 3 = 30 ft)
#   InfraDecimals = 0  →  "%d InfraUnit"   (integer)
#   InfraDecimals = 1  →  "%d.%d InfraUnit"
#                   val = infra * InfraMult / InfraDiv (tenths when Decimals=1, integer when 0)

[en]
WeightUnit=lb
WeightMult=1
WeightDiv=1
CharWeightFmt=STONES
CharWeightStonesDiv=14
HeightFmt=FTIN
HeightFtDiv=12
InfraUnit=ft
InfraMult=10
InfraDiv=1
InfraDecimals=0

[es]
WeightUnit=kg
WeightMult=4536
WeightDiv=10000
CharWeightFmt=DECIMAL
CharWeightUnit=kg
CharWeightMult=4536
CharWeightDiv=1000
HeightFmt=DECIMAL
HeightUnit=cm
HeightMult=254
HeightDiv=100
InfraUnit=mt
InfraMult=3048
InfraDiv=10000
InfraDecimals=1
